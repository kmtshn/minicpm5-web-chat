<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>MiniCPM5 Web Chat</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
      --bg:#0b1020; --panel:#121a2f; --line:#26314f; --text:#eef3ff;
      --muted:#9aabc9; --accent:#7aa2ff; --user:#2754a6; --danger:#ff8d8d;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
    body { min-height:100dvh; }
    button, textarea { font:inherit; }
    .app { max-width:820px; margin:0 auto; min-height:100dvh; display:grid; grid-template-rows:auto 1fr auto; }
    .top { position:sticky; top:0; z-index:5; padding:14px 16px; border-bottom:1px solid var(--line); background:#0b1020ee; backdrop-filter:blur(10px); }
    .title-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    h1 { margin:0; font-size:18px; }
    .badge { font-size:11px; padding:5px 8px; border:1px solid var(--line); border-radius:999px; color:#cdd8f1; white-space:nowrap; }
    .sub { margin-top:4px; font-size:12px; color:var(--muted); }
    .status { margin-top:10px; font-size:12px; color:#c8d4ef; min-height:18px; }
    .bar { height:6px; background:#1a2440; border-radius:999px; overflow:hidden; margin-top:7px; }
    .bar > div { height:100%; width:0; background:var(--accent); transition:width .2s ease; }
    .chat { padding:16px; display:flex; flex-direction:column; gap:12px; overflow-wrap:anywhere; }
    .msg { max-width:88%; padding:11px 14px; border-radius:16px; white-space:pre-wrap; line-height:1.55; box-shadow:0 4px 16px #0002; }
    .msg.user { align-self:flex-end; background:var(--user); border-bottom-right-radius:5px; }
    .msg.ai { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:5px; }
    .msg.error { border-color:#7b3b46; color:#ffd4d4; }
    .thinking { display:flex; align-items:center; gap:9px; min-width:104px; color:var(--muted); }
    .thinking-label { font-size:13px; }
    .thinking-dots { display:flex; align-items:center; gap:4px; }
    .thinking-dots span { width:6px; height:6px; border-radius:50%; background:var(--muted); opacity:.35; animation:thinkingPulse 1.15s infinite ease-in-out; }
    .thinking-dots span:nth-child(2) { animation-delay:.15s; }
    .thinking-dots span:nth-child(3) { animation-delay:.3s; }
    @keyframes thinkingPulse {
      0%, 70%, 100% { transform:translateY(0) scale(.9); opacity:.3; }
      35% { transform:translateY(-4px) scale(1.08); opacity:1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .thinking-dots span { animation:none; opacity:.65; }
    }
    .composer { position:sticky; bottom:0; padding:10px 12px max(10px, env(safe-area-inset-bottom)); background:#0b1020ee; border-top:1px solid var(--line); display:grid; grid-template-columns:1fr auto; gap:8px; backdrop-filter:blur(10px); }
    textarea { width:100%; resize:none; min-height:50px; max-height:150px; padding:12px; border-radius:14px; border:1px solid var(--line); background:#10182c; color:var(--text); outline:none; }
    textarea:focus { border-color:var(--accent); }
    .send { border:0; border-radius:14px; min-width:70px; padding:0 16px; background:var(--accent); color:#081020; font-weight:750; }
    button:disabled, textarea:disabled { opacity:.5; }
    .hint { grid-column:1/-1; display:flex; justify-content:space-between; gap:12px; align-items:center; font-size:11px; color:var(--muted); }
    .linkbtn { border:0; background:transparent; color:#b9c9ef; padding:2px 0; text-decoration:underline; }
    @media (max-width:520px) { .msg{max-width:94%;} .badge{display:none;} }
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title-row">
      <h1>MiniCPM5 Web Chat</h1>
      <span class="badge">APIキー不要 / 端末内推論</span>
    </div>
    <div class="sub">MiniCPM5-2B Q4_K_M · ブラウザだけで動作</div>
    <div class="status" id="status">起動しています…</div>
    <div class="bar"><div id="progress"></div></div>
  </header>

  <main class="chat" id="chat" aria-live="polite"></main>

  <form class="composer" id="form">
    <textarea id="input" rows="2" placeholder="メッセージを入力" disabled></textarea>
    <button class="send" id="send" type="submit" disabled>送信</button>
    <div class="hint">
      <span>初回のみ約1.56GBのモデルを取得します。</span>
      <button class="linkbtn" id="clear" type="button">会話を消去</button>
    </div>
  </form>
</div>

<script type="module">
  import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/esm/index.js';

  const WLLAMA_CONFIG = {
    default: 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/src/wasm/wllama.wasm'
  };

  const MODEL = {
    repo: 'openbmb/MiniCPM5-2B-GGUF',
    file: 'MiniCPM5-2B-Q4_K_M.gguf'
  };

  const $ = (q) => document.querySelector(q);
  const chat = $('#chat');
  const statusEl = $('#status');
  const progressEl = $('#progress');
  const form = $('#form');
  const input = $('#input');
  const send = $('#send');
  const clearBtn = $('#clear');

  let engine = null;
  let generating = false;
  const messages = [
    { role:'system', content:'あなたは親切で正確なAIアシスタントです。原則として日本語で、簡潔かつ分かりやすく回答してください。' }
  ];

  function setReady(ready) {
    input.disabled = !ready;
    send.disabled = !ready;
  }

  function addMessage(text, role, extra='') {
    const el = document.createElement('div');
    el.className = `msg ${role} ${extra}`.trim();
    el.textContent = text;
    chat.appendChild(el);
    requestAnimationFrame(() => window.scrollTo({ top:document.body.scrollHeight, behavior:'smooth' }));
    return el;
  }

  function addThinkingMessage() {
    const el = document.createElement('div');
    el.className = 'msg ai';
    el.setAttribute('aria-label', 'AIが考え中です');
    el.innerHTML = `
      <div class="thinking">
        <span class="thinking-label">考え中</span>
        <span class="thinking-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
      </div>`;
    chat.appendChild(el);
    requestAnimationFrame(() => window.scrollTo({ top:document.body.scrollHeight, behavior:'smooth' }));
    return el;
  }

  function browserNote() {
    const ua = navigator.userAgent;
    const mobile = /Android|iPhone|iPad/i.test(ua);
    const gpu = !!navigator.gpu;
    return `${mobile ? 'モバイル端末' : 'PC'} / ${gpu ? 'WebGPU利用可能' : 'WebGPUなし・WASMで実行'}`;
  }

  async function init() {
    try {
      setReady(false);
      statusEl.textContent = `ランタイム初期化中… ${browserNote()}`;
      engine = new Wllama(WLLAMA_CONFIG, {
        parallelDownloads: 3,
        allowOffline: true
      });

      await engine.loadModelFromHF(MODEL, {
        n_ctx: 2048,
        n_threads: 1,
        progressCallback: (p) => {
          const loaded = p.loaded ?? p.loadedBytes ?? 0;
          const total = p.total ?? p.totalBytes ?? 0;
          if (total > 0) {
            const pct = Math.max(0, Math.min(100, Math.round(loaded / total * 100)));
            progressEl.style.width = `${pct}%`;
            statusEl.textContent = `モデルを準備中… ${pct}%`;
          } else if (typeof p.progress === 'number') {
            const pct = Math.round(p.progress * 100);
            progressEl.style.width = `${pct}%`;
            statusEl.textContent = `モデルを準備中… ${pct}%`;
          }
        }
      });

      progressEl.style.width = '100%';
      statusEl.textContent = `準備完了 — ${browserNote()}`;
      setReady(true);
      addMessage('準備できました。通信先のAI APIは使わず、この端末内でMiniCPM5-2Bが回答します。', 'ai');
      input.focus();
    } catch (err) {
      console.error(err);
      statusEl.textContent = '初期化に失敗しました';
      addMessage(
        `モデルを起動できませんでした。\n\n${err?.message ?? err}\n\n空きメモリの多いChrome/Edge系ブラウザで再度お試しください。`,
        'ai', 'error'
      );
    }
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (!engine || generating) return;
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    addMessage(text, 'user');
    messages.push({ role:'user', content:text });
    generating = true;
    setReady(false);
    statusEl.textContent = '考え中…';
    const bubble = addThinkingMessage();

    try {
      let full = '';
      let started = false;
      const stream = await engine.createChatCompletion({
        messages,
        max_tokens: 384,
        temperature: 0.7,
        top_p: 0.9,
        stream: true
      });

      for await (const chunk of stream) {
        const piece = chunk?.choices?.[0]?.delta?.content ?? '';
        if (!piece) continue;
        if (!started) {
          started = true;
          bubble.removeAttribute('aria-label');
          bubble.textContent = '';
          statusEl.textContent = '回答を生成中…';
        }
        full += piece;
        bubble.textContent = full;
        window.scrollTo({ top:document.body.scrollHeight });
      }

      full = full.trim();
      if (!full) full = '（応答がありませんでした）';
      bubble.textContent = full;
      messages.push({ role:'assistant', content:full });
      statusEl.textContent = `準備完了 — ${browserNote()}`;
    } catch (err) {
      console.error(err);
      bubble.classList.add('error');
      bubble.textContent = `生成エラー: ${err?.message ?? err}`;
      statusEl.textContent = '生成エラー';
    } finally {
      generating = false;
      setReady(true);
      input.focus();
    }
  });

  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
      ev.preventDefault();
      form.requestSubmit();
    }
  });

  clearBtn.addEventListener('click', () => {
    messages.splice(1);
    chat.innerHTML = '';
    addMessage('会話履歴を消去しました。', 'ai');
  });

  init();
</script>
</body>
</html>
